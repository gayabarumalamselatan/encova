services:
  encova:
    image: ghcr.io/asiasistemindonesia/encova:latest
    # Uncomment the 'build' block to build locally instead of pulling from registry
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: encova-app
    restart: unless-stopped

    ports:
      # Next.js application
      - "3000:3000"
      # MediaMTX: RTSP
      - "8554:8554"
      # MediaMTX: RTMP ingest (used by FFmpeg / node-media-server)
      - "1935:1935"
      # MediaMTX: HLS / WebRTC HTTP API
      - "8888:8888"
      # node-media-server HTTP API
      - "8000:8000"

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      STORAGE_PATH: /storage
      DOCKER: "true"
      # ── Add your application secrets below. ──────────────────────────────
      # It is recommended to use a .env file and reference it with env_file.
      # DATABASE_URL: postgres://user:pass@host:5432/encova
      # NEXTAUTH_SECRET: your-secret-here
      # NEXTAUTH_URL: http://localhost:3000

    # Uncomment to load secrets from a .env file (kept out of version control)
    # env_file:
    #   - .env

    volumes:
      # ── CCTV settings ──────────────────────────────────────────────────────
      # To use your real camera config, copy settings.json to the server first:
      #   scp settings.json user@server-ip:~/encova/settings.json
      # Then uncomment the line below and restart:
      - ./data/settings:/app/data/settings
      # ── NAS Storage ────────────────────────────────────────────────────────
      - /mnt/encova:/storage
      # ── Persistent downloads ────────────────────────────────────────────────
      - ./downloads:/app/public/downloads

    # Resource limits (tune based on your server capacity)
    deploy:
      resources:
        limits:
          memory: 2g

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

# (No global volumes needed)

  prometheus:
    image: prom/prometheus:latest
    container_name: encova-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: encova-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards

  node-exporter:
    image: prom/node-exporter:latest
    container_name: encova-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: encova-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true

volumes:
  grafana-data:
