# =============================================================================
# GitHub Actions — Build & Publish Encova Docker Image
# =============================================================================
# Triggers : push to 'main'  OR  manual run from Actions tab
#
# What this does:
#   1. Install npm deps  (npm install --legacy-peer-deps)
#   2. Build Next.js app (npm run build)
#   3. Build Docker image
#   4. Push image to GitHub Container Registry (GHCR)
#
# NO extra secrets required — GITHUB_TOKEN is provided automatically.
#
# After this runs, your image is available at:
#   ghcr.io/<your-github-username>/encova:latest
# =============================================================================

name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch: # allows manual trigger from the Actions tab

env:
  REGISTRY: ghcr.io
  # Image name is automatically derived from the repo owner + "encova"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/encova

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest

    # Grant write access to GitHub Packages (GHCR) — no other secrets needed
    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. Checkout source code ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js and install dependencies ──────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── 3. Build the Next.js app ────────────────────────────────────────────
      # The build output (.next/standalone) is what gets copied into the image.
      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      # ── 4. Set up Docker Buildx (required for cache & multi-platform) ───────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 5. Log in to GHCR using the automatic GITHUB_TOKEN ─────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. Generate image tags ──────────────────────────────────────────────
      # Produces two tags on every push to main:
      #   ghcr.io/<owner>/encova:latest
      #   ghcr.io/<owner>/encova:main-<short-sha>   ← useful for rollback
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,format=short

      # ── 7. Build & push the Docker image ────────────────────────────────────
      # Uses GitHub Actions cache to skip rebuilding unchanged layers
      # (especially the heavy system-deps stage with LibreOffice / FFmpeg).
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 8. Print the published image details ────────────────────────────────
      - name: Summary
        run: |
          echo "## ✅ Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull the image with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
